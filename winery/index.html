<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14181d">
<link rel="icon" href="../icon.svg">
<title>Cellar for wineries</title>
<style>
:root { --bg: #eef0ec; --surface: #fbfcfa; --ink: #15191e; --muted: #5d6660; --line: #d5dad3; --claret: #7b1e3c; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #101316; --surface: #181d21; --ink: #e8ece8; --muted: #9aa49e; --line: #2b3237; --claret: #e07a98; --bad: #f08b84; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.45 "Helvetica Neue", Arial, sans-serif; }
form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
img { width: 56px; height: 56px; }
h1 { font-size: 24px; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 14px; }
input[type=password] { font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
label.keep { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
button { font: inherit; font-weight: 600; padding: 13px; border: 0; border-radius: 14px; background: var(--claret); color: #fff; cursor: pointer; }
#err { color: var(--bad); min-height: 1.4em; }
.lang { display: flex; gap: 6px; }
.lang button { flex: 1; padding: 8px; font-weight: 500; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
</style>
</head>
<body>
<form id="lock" autocomplete="off">
  <img src="../icon.svg" alt="">
  <h1>Cellar for wineries</h1>
  <div class="lang" role="group" aria-label="Language / Sprache"><button type="button" data-lang="en">English</button><button type="button" data-lang="de">Deutsch</button></div>
  <p id="intro">Showcase for wineries, with an invented demo winery. Enter the password you were given.</p>
  <input type="password" id="pw" placeholder="Password" aria-label="Password" autofocus>
  <label class="keep"><input type="checkbox" id="keep" checked> <span id="keeplabel">Remember on this device</span></label>
  <button type="submit" id="go">Open</button>
  <p id="err" role="alert"></p>
</form>

                 de: ["Showcase für Weingüter, mit einem erfundenen Demo-Weingut. Gib das Passwort ein, das du bekommen hast.", "Passwort", "Auf diesem Gerät merken", "Öffnen", "Wird geöffnet…", "Das Passwort hat nicht gepasst."] };

  function setLang(l) {

  async function keyBits(pw) {
