<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14181d">
<link rel="icon" href="../icon.svg">
<title>Cellar for wineries</title>
<style>
:root { --bg: #eef0ec; --surface: #fbfcfa; --ink: #15191e; --muted: #5d6660; --line: #d5dad3; --claret: #7b1e3c; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #101316; --surface: #181d21; --ink: #e8ece8; --muted: #9aa49e; --line: #2b3237; --claret: #e07a98; --bad: #f08b84; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 16px 16px 40px; color: var(--ink); font: 15px/1.45 "Helvetica Neue", Arial, sans-serif;
  background: #1d140c url("../cellar.jpg") 34% 50% / cover no-repeat; }
/* the photo: an old vaulted cellar, darkened towards the bottom so the form stays readable; the form in the middle */
body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(180deg, rgba(16,10,6,.08), rgba(16,10,6,.55)); pointer-events: none; }
form { position: relative; width: 100%; max-width: 340px; background: color-mix(in srgb, var(--surface) 84%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
  border: 1px solid rgba(255,255,255,.28); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.45); }
/* image credit one tap away, not on the page */
button.foot { position: fixed; right: 10px; bottom: 8px; padding: 4px 6px; background: none; border-radius: 6px; font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,.8); text-decoration: underline; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
dialog { max-width: 340px; border: 0; border-radius: 16px; padding: 20px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog p { color: var(--ink); margin-bottom: 14px; }
dialog a { color: var(--claret); }
dialog button { width: 100%; }
img { width: 56px; height: 56px; }
h1 { font-size: 24px; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 14px; }
input[type=password] { font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
label.keep { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
button { font: inherit; font-weight: 600; padding: 13px; border: 0; border-radius: 14px; background: var(--claret); color: #fff; cursor: pointer; }
#err { color: var(--bad); min-height: 1.4em; }
.lang { display: flex; gap: 6px; }
.lang button { flex: 1; padding: 8px; font-weight: 500; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
</style>
</head>
<body>
<form id="lock" autocomplete="off">
  <img src="../icon.svg" alt="">
  <h1>Cellar for wineries</h1>
  <div class="lang" role="group" aria-label="Language / Sprache"><button type="button" data-lang="en">English</button><button type="button" data-lang="de">Deutsch</button></div>
  <p id="intro">Showcase for wineries, with an invented demo winery. Enter the password you were given.</p>
  <input type="password" id="pw" placeholder="Password" aria-label="Password" autofocus>
  <label class="keep"><input type="checkbox" id="keep" checked> <span id="keeplabel">Remember on this device</span></label>
  <button type="submit" id="go">Open</button>
  <p id="err" role="alert"></p>
</form>
<button type="button" class="foot" id="credbtn">Credits</button>
<dialog id="credits"><p><span id="credtxt">Background photo:</span> <a href="https://commons.wikimedia.org/wiki/File:Wine_cellar.jpg" target="_blank" rel="noopener">wine cellar in Chvalovice, by Che</a> (Wikimedia Commons), <a href="https://creativecommons.org/licenses/by-sa/2.5/" target="_blank" rel="noopener">CC BY-SA 2.5</a></p><button type="button" id="credclose">Close</button></dialog>

    // OpenSSL "Salted__" format: 8-byte salt, then PBKDF2 gives the AES key (32 bytes) and IV (16 bytes)
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: bytes.slice(8, 16), iterations: ITER, hash: "SHA-256" }, base, 384));
  }
  async function open(bits) {
    const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    const plain = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32) }, key, bytes.slice(16)));
    if (plain[0] !== 0x1f || plain[1] !== 0x8b) throw new Error("wrong password");  // the page is gzipped before encryption
    const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    if (!html.startsWith("<!doctype html>")) throw new Error("wrong password");
    document.open(); document.write(html); document.close();
  }
  const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
  const unhex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));
  try { const saved = localStorage.getItem(STORE); if (saved) open(unhex(saved)).catch(() => localStorage.removeItem(STORE)); } catch (e) {}
  document.getElementById("lock").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("err"), go = document.getElementById("go");
    err.textContent = ""; go.disabled = true; go.textContent = TEXT[lang][4];
    try {
      const bits = await keyBits(document.getElementById("pw").value);
      await open(bits);
      try { if (document.getElementById("keep") && document.getElementById("keep").checked) localStorage.setItem(STORE, hex(bits)); } catch (e2) {}
    } catch (x) {
      err.textContent = TEXT[lang][5]; go.disabled = false; go.textContent = TEXT[lang][3];
    }
  });
})();
</script>
